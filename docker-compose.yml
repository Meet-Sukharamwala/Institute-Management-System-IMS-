services:
  mysql:
    image: mysql:8.0
    container_name: ims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeMeRoot_2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ims_production}
      MYSQL_USER: ${MYSQL_USER:-ims_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ChangeMeApp_2026!}
    ports:
      - "3306:3306"
    volumes:
      - ims_mysql_data:/var/lib/mysql
      - ./database/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ims-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ims-web:1.0.0
    container_name: ims-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /var/lib/ims/data/ims.sqlite
      DATABASE_URL: mysql://${MYSQL_USER:-ims_app}:${MYSQL_PASSWORD:-ChangeMeApp_2026!}@mysql:3306/${MYSQL_DATABASE:-ims_production}
      SESSION_TTL_HOURS: 12
    ports:
      - "3000:3000"
    volumes:
      - ims_sqlite_data:/var/lib/ims/data
      - ims_backups:/app/backups

volumes:
  ims_mysql_data:
  ims_sqlite_data:
  ims_backups:
